<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pračka</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --fg:#1b1d21; --muted:#6b7280; --acc:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b21; --fg:#e8eaed; --muted:#9aa0a6; --line:#2a2e36; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:4px 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .state { font-size:26px; font-weight:650; }
  .muted { color:var(--muted); font-size:14px; }
  .big { font-size:40px; font-variant-numeric:tabular-nums; font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .pill { font-size:13px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); }
  .pill.ok { color:var(--ok); border-color:var(--ok); } .pill.warn { color:var(--warn); border-color:var(--warn); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  select, input { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-size:16px; }
  button { flex:1; min-width:100px; padding:12px; border-radius:10px; border:0; font-size:16px; font-weight:600; cursor:pointer; background:var(--line); color:var(--fg); }
  button.primary { background:var(--acc); color:#fff; } button.danger { background:var(--err); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  #msg { min-height:20px; font-size:14px; margin-top:10px; }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  details summary { cursor:pointer; color:var(--muted); font-size:14px; }
  .seg { display:flex; gap:6px; margin-top:4px; }
  .seg button { min-width:0; padding:10px 6px; font-size:14px; font-weight:500; }
  .seg button.on { background:var(--acc); color:#fff; }
  .toggles { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .toggles label { display:flex; gap:8px; align-items:center; margin:0; font-size:15px; color:var(--fg);
    padding:10px; border:1px solid var(--line); border-radius:10px; cursor:pointer; }
  .toggles input { width:auto; margin:0; accent-color:var(--acc); }
  .summary { margin-top:6px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1><span id="name">Pračka</span> <span id="conn" class="pill">…</span></h1>

  <section class="card">
    <div class="state" id="state">Načítám…</div>
    <div class="muted" id="phase"></div>
    <div class="big" id="remaining">–</div>
    <div class="muted summary" id="current"></div>
    <div class="row" id="pills" style="margin-top:8px"></div>
  </section>

  <section class="card">
    <label for="program">Program</label>
    <select id="program"></select>
    <div id="modeBox"></div>
    <div id="options"></div>
    <div id="drying"></div>
    <div class="toggles" id="toggles"></div>
    <div id="delayBox"></div>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="btnStart">Start</button>
      <button id="btnPause">Pauza</button>
      <button id="btnResume">Pokračovat</button>
      <button class="danger" id="btnStop">Stop</button>
    </div>
    <div id="msg"></div>
  </section>

  <details class="card">
    <summary>Nastavení</summary>
    <label for="token">Lokální API token (pokud je nastaven LOCAL_API_TOKEN)</label>
    <input id="token" type="password" autocomplete="off">
  </details>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const STATES = { OFF:"Vypnuto", IDLE:"Připraveno", READY_TO_START:"Připraveno ke startu", RUNNING:"Běží",
  PAUSED:"Pozastaveno", DELAYED_START:"Odložený start", END_OF_CYCLE:"Hotovo", ALARM:"Chyba" };
const RC = { ENABLED:"Dálkový start povolen", NOT_SAFETY_RELEVANT_ENABLED:"Dálkový start nepovolen",
  DISABLED:"Dálkové ovládání vypnuto", TEMPORARY_LOCKED:"Dočasně zamčeno" };
const PHASES = { ANTICREASE:"Proti pomačkání", COOL:"Chlazení", DRAIN:"Vypouštění", DRY:"Sušení", PREWASH:"Předpírka",
  RINSE:"Máchání", SPIN:"Odstřeďování", STEAM:"Pára", WASH:"Praní" };
const ALERTS = { CHECK_DOOR:"Zkontroluj dvířka", CHECK_DRAIN_FILTER:"Vyčisti filtr čerpadla",
  CHECK_INLET_TAP:"Zkontroluj přívod vody", CLEAN_FLUFF_DRAWER:"Vyčisti filtr vláken",
  DETERGENT_OVERDOSING:"Předávkovaný prací prostředek", DOOR:"Dvířka", EMPTY_WATER_CONTAINER:"Vylij nádržku na vodu",
  MACHINE_RESTART:"Restart pračky", POWER_FAILURE:"Výpadek proudu", STEAM_TANK_FULL:"Nádržka páry je plná",
  TOP_UP_SALT:"Doplň sůl", UNBALANCED_LAUNDRY:"Nevyvážené prádlo" };
// Programy z panelu pračky v jejich pořadí, pak ostatní z aplikace.
const PANEL = [
  ["COTTON_PR_ECO40-60", "Eco 40-60"], ["COTTON_PR_COTTONS", "Bavlna"], ["SYNTHETIC_PR_SYNTHETICS", "Syntetika"],
  ["NON_STOP_3KG_3H_NONSTOP3H_3KG", "NonStop 3h/3kg"], ["DELICATE_PR_DELICATES", "Jemné prádlo"],
  ["WOOL_PR_WOOL_HANDWASH", "Vlna/Ruční praní"], ["SPORT_JACKETS_PR_OUTDOOR", "Outdoor"],
  ["STEAM_REFRESH_PR_STEAM", "Pára"], ["SOFTENER_PR_RINSE", "Máchání"], ["SPIN_PR_DRAIN_SPIN", "Odstřeďování/Vypouštění"],
];
const PROGRAMS = Object.fromEntries([...PANEL,
  ["BLANKET_PR_DUVET", "Přikrývky"], ["COTTON_PR_TOWELS", "Ručníky"], ["COTTON_PR_WORKINGCLOTHES", "Pracovní oděvy"],
  ["DELICATE_PR_BABY", "Dětské prádlo"], ["DENIM_PR_DENIM", "Denim"], ["DRUM_CLEAN_PR_MACHINECLEAN", "Čištění bubnu"],
  ["JEANS_PR_DARKCLOTHES", "Tmavé prádlo"], ["MINI_PR_SILK", "Hedvábí"], ["QUICK_20_MIN_PR_20MIN3KG", "Rychlý 20 min / 3 kg"],
  ["SANITISE60_PR_ANTIALLERGY", "Antialergie"], ["SPORT_JACKETS_PR_DOWN_JACKET", "Péřové bundy"],
  ["STEAM_DEWRINKLER_PR_STEAMCASHMERE", "Pára – kašmír"], ["SYNTHETIC_PR_BEDLINEN", "Ložní prádlo"],
  ["SYNTHETIC_PR_MICROFIBRE", "Mikrovlákno"], ["SYNTHETIC_PR_SPORTWEAR", "Sportovní oblečení"],
]);
const OPT_LABELS = { analogTemperature:"Teplota", analogSpinSpeed:"Odstřeďování", steamValue:"Pára", timeManagerLevel:"Délka programu" };
const VALUES = { COLD:"Studená", "0_RPM":"Bez odstřeďování", STEAM_OFF:"Vypnuto", STEAM_MIN:"Nízká", STEAM_MED:"Střední",
  STEAM_MAX:"Vysoká", DAILY:"Denní", NORMAL:"Normální", SUPER_QUICK:"Rychlý" };
const HUMIDITY = { CUPBOARD:"Do skříně", EXTRA:"Extra suché", IRON:"K žehlení" };
const TOGGLES = { stain:"Skvrny", preWashPhase:"Předpírka", anticreaseNoSteam:"Proti pomačkání",
  nightCycle:"Noční cyklus", rinseHold:"Stop s vodou", wmEconomy:"Úsporný" };
const MODES = { WASH:"Praní", WASH_DRY:"Praní + sušení", DRY:"Jen sušení" };
const MODE_FLAGS = { WASH:[true,false], WASH_DRY:[true,true], DRY:[false,true] };  // [wetMode, dryMode]
// Co pračka vypne (podle triggerů v capabilities): při sušení, při „jen sušení“ a pod 40 °C.
const OFF_WHEN_DRYING = ["nightCycle", "rinseHold"];
const WASH_ONLY = ["analogTemperature", "analogSpinSpeed", "steamValue", "timeManagerLevel", "stain", "preWashPhase",
  "nightCycle", "rinseHold", "wmEconomy"];
const NEEDS_40 = ["stain", "steamValue"];

let programs = [], status = {}, mode = "WASH";
let token = ""; try { token = localStorage.getItem("washerToken") || ""; } catch {}
$("token").value = token;
$("token").onchange = e => { token = e.target.value; try { localStorage.setItem("washerToken", token); } catch {} load(); };

const human = v => {
  const s = String(v);
  let m;
  if (VALUES[s]) return VALUES[s];
  if ((m = s.match(/^(\d+)_CELSIUS$/))) return m[1] + " °C";
  if ((m = s.match(/^(\d+)_RPM$/))) return m[1] + " ot/min";
  return s.replace(/_PR_/, " · ").replace(/_/g, " ").toLowerCase().replace(/^\w/, c => c.toUpperCase());
};
const progName = id => PROGRAMS[id] || human(id);
const hm = sec => `${Math.floor(sec/3600)}:${String(Math.floor(sec%3600/60)).padStart(2,"0")}`;
const current = () => programs.find(p => p.id === $("program").value);

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Content-Type":"application/json", "X-API-Token": token } });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail || r.statusText));
  return body;
}
function msg(text, cls = "") { $("msg").textContent = text; $("msg").className = cls; }

// Výchozí hodnota volby: aktuální nastavení pračky (pokud je vybraný stejný program), jinak default programu.
function initial(p, name) {
  const sel = status.selections || {};
  return p.id === status.program && sel[name] !== undefined ? sel[name] : p.defaults[name];
}

function renderProgram() {
  const p = current();
  if (!p) return;
  const wet = initial(p, "wetMode") ?? true, dry = initial(p, "dryMode") ?? false;
  const fromState = Object.keys(MODE_FLAGS).find(m => MODE_FLAGS[m][0] === wet && MODE_FLAGS[m][1] === dry);
  mode = p.modes.includes(fromState) ? fromState : p.modes[0];

  const box = $("options"); box.innerHTML = "";
  for (const [name, values] of Object.entries(p.options)) {
    const id = "opt_" + name;
    box.insertAdjacentHTML("beforeend", `<div data-wrap="${esc(name)}"><label for="${id}">${esc(OPT_LABELS[name] || human(name))}</label><select id="${id}" data-opt="${esc(name)}"></select></div>`);
    const sel = $(id);
    values.forEach(v => sel.add(new Option(human(v), v)));
    const init = String(initial(p, name));
    sel.value = values.includes(init) ? init : values[0];
    sel.onchange = applyRules;
  }

  $("toggles").innerHTML = p.toggles.map(name => `<label data-wrap="${esc(name)}"><input type="checkbox" data-toggle="${esc(name)}"${initial(p, name) ? " checked" : ""}> ${esc(TOGGLES[name] || human(name))}</label>`).join("");

  const d = p.drying;
  if (d && (d.humidity.length || d.time)) {
    const opts = d.humidity.map(h => `<option value="h:${esc(h)}">Automaticky – ${esc(HUMIDITY[h] || human(h))}</option>`);
    if (d.time) for (let t = d.time.min; t <= d.time.max; t += d.time.step) opts.push(`<option value="t:${t}">Časově – ${t} min</option>`);
    $("drying").innerHTML = `<div data-wrap="drying"><label for="dry">Sušení</label><select id="dry">${opts.join("")}</select></div>`;
    const h = initial(p, "humidityTarget"), t = initial(p, "dryingTime");
    const want = t ? `t:${t}` : `h:${h}`;
    if ([...$("dry").options].some(o => o.value === want)) $("dry").value = want;
  } else $("drying").innerHTML = "";

  if (p.delay) {
    const opts = ['<option value="">Hned</option>'];
    for (let s = p.delay.step; s <= p.delay.max; s += p.delay.step) opts.push(`<option value="${s}">za ${hm(s)} h</option>`);
    $("delayBox").innerHTML = `<label for="delay">Odložený start</label><select id="delay">${opts.join("")}</select>`;
  } else $("delayBox").innerHTML = "";

  $("modeBox").innerHTML = p.modes.length > 1
    ? `<label>Režim</label><div class="seg">${p.modes.map(m => `<button type="button" data-mode="${m}">${MODES[m]}</button>`).join("")}</div>`
    : (p.modes[0] !== "WASH" ? `<div class="muted" style="margin-top:8px">Režim: ${MODES[p.modes[0]]}</div>` : "");
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { mode = b.dataset.mode; applyRules(); });
  applyRules();
}

// Skryje volby, které pračka v aktuální kombinaci nepovolí.
function applyRules() {
  const [wet, dry] = MODE_FLAGS[mode];
  const temp = $("opt_analogTemperature")?.value || "";
  const tempNum = temp === "COLD" ? 0 : parseInt(temp, 10);
  const hidden = new Set([...(dry ? OFF_WHEN_DRYING : []), ...(wet ? [] : WASH_ONLY),
    ...(temp && tempNum < 40 ? NEEDS_40 : [])]);
  if (!dry) hidden.add("drying");
  document.querySelectorAll("[data-wrap]").forEach(el => el.hidden = hidden.has(el.dataset.wrap));
  document.querySelectorAll("[data-mode]").forEach(b => b.classList.toggle("on", b.dataset.mode === mode));
}

function collect() {
  const p = current();
  const visible = el => !el.closest("[data-wrap]")?.hidden;
  const options = {};
  document.querySelectorAll("[data-opt]").forEach(s => { if (visible(s)) options[s.dataset.opt] = s.value; });
  document.querySelectorAll("[data-toggle]").forEach(c => { if (visible(c)) options[c.dataset.toggle] = c.checked; });
  const [wet, dry] = MODE_FLAGS[mode];
  if (p.modes.length > 1) { options.dryMode = dry; options.wetMode = wet; }
  if (dry && $("dry") && visible($("dry"))) {
    const [kind, val] = $("dry").value.split(":");
    if (kind === "h") options.humidityTarget = val; else options.dryingTime = parseInt(val, 10);
  }
  const delay = $("delay")?.value ? parseInt($("delay").value, 10) : null;
  return { program: p.id, options, delay };
}

function renderStatus() {
  const s = status;
  $("name").textContent = s.name || "Pračka";
  const online = (s.connectionState || "").toLowerCase() === "connected";
  $("conn").textContent = online ? "online" : (s.connectionState || "offline");
  $("conn").className = "pill " + (online ? "ok" : "warn");
  $("state").textContent = STATES[s.applianceState] || s.applianceState || "–";
  $("phase").textContent = PHASES[s.cyclePhase] ? "Fáze: " + PHASES[s.cyclePhase] : "";
  const t = s.timeToEnd;
  $("remaining").textContent = (t && t > 0) ? hm(t) + " h" : "–";
  const sel = s.selections || {};
  const parts = [];
  if (s.program) parts.push(progName(s.program));
  if (sel.wetMode !== false && sel.analogTemperature) parts.push(human(sel.analogTemperature));
  if (sel.wetMode !== false && sel.analogSpinSpeed && sel.analogSpinSpeed !== "DISABLED") parts.push(human(sel.analogSpinSpeed));
  if (sel.dryMode) parts.push(sel.dryingTime ? `sušení ${sel.dryingTime} min` : `sušení: ${(HUMIDITY[sel.humidityTarget] || "auto").toLowerCase()}`);
  $("current").textContent = parts.join(" · ");
  const pills = [];
  if (s.remoteControl) pills.push(`<span class="pill ${s.remoteStartAllowed ? "ok" : "warn"}">${esc(RC[s.remoteControl] || s.remoteControl)}</span>`);
  if (s.doorState) pills.push(`<span class="pill">Dvířka: ${s.doorState === "OPEN" ? "otevřená" : "zavřená"}</span>`);
  (s.alerts || []).forEach(a => { const code = a.code || a; pills.push(`<span class="pill warn">${esc(ALERTS[code] || human(code))}</span>`); });
  $("pills").innerHTML = pills.join("");
  const st = s.applianceState;
  $("btnStart").disabled = !s.remoteStartAllowed || ["RUNNING","PAUSED","DELAYED_START"].includes(st);
  $("btnPause").disabled = !["RUNNING","DELAYED_START"].includes(st);
  $("btnResume").disabled = st !== "PAUSED";
  $("btnStop").disabled = !["RUNNING","PAUSED","DELAYED_START","END_OF_CYCLE"].includes(st);
}

function fillPrograms() {
  const ids = new Set(programs.map(p => p.id));
  const panel = PANEL.map(([id]) => id).filter(id => ids.has(id));
  const rest = programs.map(p => p.id).filter(id => !panel.includes(id))
    .sort((a, b) => progName(a).localeCompare(progName(b), "cs"));
  const group = (label, list) => list.length
    ? `<optgroup label="${label}">${list.map(id => `<option value="${esc(id)}">${esc(progName(id))}</option>`).join("")}</optgroup>` : "";
  $("program").innerHTML = group("Na panelu", panel) + group("Další programy", rest);
  if (status.program && ids.has(status.program)) $("program").value = status.program;
}

async function load() {
  try {
    status = await api("/api/status");
    if (!programs.length) {
      programs = await api("/api/programs");
      fillPrograms();
      renderProgram();
    }
    renderStatus();
  } catch (e) { msg(e.message, "err"); }
}

async function action(path, body) {
  msg("Odesílám…");
  try { await api(path, { method:"POST", body: body ? JSON.stringify(body) : undefined }); msg("OK", "ok"); setTimeout(load, 1500); }
  catch (e) { msg(e.message, "err"); }
}

$("program").onchange = renderProgram;
$("btnStart").onclick = () => action("/api/start", collect());
$("btnPause").onclick = () => action("/api/pause");
$("btnResume").onclick = () => action("/api/resume");
$("btnStop").onclick = () => confirm("Opravdu zastavit program?") && action("/api/stop");

load(); setInterval(load, 10000);
</script>
</body>
</html>
