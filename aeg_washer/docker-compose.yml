services:
  aeg-washer:
    build: .
    container_name: aeg-washer
    env_file: .env
    environment:
      TOKEN_FILE: /srv/data/tokens.json
    volumes:
      - ./data:/srv/data
    ports:
      # jen lokálně – ven se služba publikuje přes `tailscale serve` (viz README),
      # na VPS by jinak byla vidět z celého internetu
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
